name: CountOn checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: counton
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: counton
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U counton -d counton"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_TARGET: local
      LOCAL_DATABASE_URL: postgresql+psycopg://counton:ci-fixture-only@127.0.0.1:5432/counton
      TEST_DATABASE_URL: postgresql+psycopg://counton:ci-fixture-only@127.0.0.1:5432/counton_test
      BEDROCK_ENABLED: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/*requirements*.txt
            backend/constraints.txt
      - name: Update the audited installer
        run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-security.txt
      - name: Alexa cryptographic dependencies and adapter import
        run: python db/scripts/alexa_import_smoke.py
      - name: Prepare isolated test database
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ['LOCAL_DATABASE_URL'], isolation_level='AUTOCOMMIT').connect() as db:
              db.execute(text('CREATE DATABASE counton_test'))
          PY
      - run: ruff check app db/scripts tests alembic ../scripts
      - run: mypy app --ignore-missing-imports
      - run: mypy --strict --follow-imports=silent --ignore-missing-imports app/ai app/agent app/alexa app/mcp/compiler.py app/mcp/intelligence.py app/mcp/conversation_state.py app/mcp/schemas.py app/api/v1/agent.py app/api/v1/alexa.py app/schemas/compiler.py app/schemas/clarification.py app/schemas/investigation.py app/schemas/trust.py app/services/compiler_service.py app/services/investigation_service.py app/services/investigator_service.py app/services/agent_audit.py db/scripts/bedrock_smoke.py
      - run: python -m pytest -q --tb=short
      - run: python db/scripts/production_smoke.py
      - name: Synthetic orchestration evaluation (human review remains a release gate)
        run: python db/scripts/orchestration_eval.py
      - name: Medium and high severity static security gate
        run: bandit -q -r app -ll
      - run: pip-audit --progress-spinner off
      - run: git diff --check
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # Credential-free validation artifact; CI does not deploy this build.
          # Real Vercel builds must use the configured production API origin.
          NEXT_PUBLIC_API_BASE_URL: https://api.counton.invalid
      - run: npm audit --omit=dev
      - name: Audit frontend build and runtime dependencies
        run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history and source without printing findings
        run: python3 scripts/secret_scan.py
